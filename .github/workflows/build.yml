name: Build

on:
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  setup_and_build:
    runs-on: macos-15-intel
    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Set bun version
        run: bun set version 10.33.2

      - name: Checkout Books
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: yarn

      - name: Run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_NOTARIZE: 0
        run: bun build -mw --publish never
