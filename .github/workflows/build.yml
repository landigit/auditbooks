name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  setup_and_build:
    runs-on: macos-15-intel
    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Set pnpm version
        run: pnpm set version 11.5.1

      - name: Checkout Books
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: pnpm

      - name: Run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_NOTARIZE: 0
        run: pnpm build -mw --publish never
