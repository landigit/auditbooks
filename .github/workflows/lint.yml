name: Lint

on:
  push:
    branches: [$default-branch]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  setup_and_lint:
    runs-on: macos-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Set pnpmversion
        run: pnpmset version 10.33.2

      - name: Checkout Books
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: yarn

      - name: Lint
        run: pnpmlint

      - name: Check Formatting
        run: pnpmprettier --check .
