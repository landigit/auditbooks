name: Publish

# Trigger manually from GitHub Actions tab OR automatically on version tag push
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # e.g. v0.37.9, v1.0.0

jobs:
  # ─── Build for each platform ──────────────────────────────────────────────

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            os-name: windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os-name: linux
          - platform: macos-latest
            target: aarch64-apple-darwin
            os-name: macos-arm
          - platform: macos-13
            target: x86_64-apple-darwin
            os-name: macos-intel

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # auto-replaced with version from tauri.conf.json
          releaseName: 'Auditbooks v__VERSION__'
          releaseBody: |
            See the full changelog in CHANGELOG.md
          releaseDraft: true # creates a Draft — you review & publish manually
          prerelease: false
          args: --target ${{ matrix.target }}
