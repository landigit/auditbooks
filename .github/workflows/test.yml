name: Test

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  setup_and_test:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm test

  setup_and_uitest:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: pnpm install

      - name: Build Source Files
        run: pnpm build:frontend

      - name: Build Tauri Binary
        run: pnpm tauri build --debug

      - name: Run UI Tests
        run: pnpm uitest
