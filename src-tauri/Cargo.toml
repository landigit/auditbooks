[package]
name = "auditbooks"
version = "0.37.9"
description = "Simple Book keeping app for Everyone"
authors = ["Landgit Agency"]
license = "AGPL-3.0-only"
repository = "https://gitlab.com/landgit/auditbooks"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-store = "2.4.3"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.dev]
opt-level = 1        # Minimal optimization: faster runtime, near-identical rebuild speed

[profile.release]
opt-level = "z"       # Optimize for binary size across all platforms
lto = true            # Enable Link-Time Optimization
codegen-units = 1     # Maximize compiler optimization passes
panic = "abort"       # Disable stack unwinding to reduce binary footprint
strip = true          # Strip debug symbols and symbol tables
