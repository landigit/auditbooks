[package]
name = "app"
version = "0.1.0"
description = "Auditbooks — Simple book-keeping app for everyone"
authors = ["Landigit Agency"]
license = "AGPL-3.0-only"
repository = "https://github.com/landigit/auditbooks"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
hex = "0.4"
tauri = { version = "2.11.2", features = [] }
libsql-rusqlite = "0.33.0"

# Official Tauri plugins (sql plugin removed — using libsql-rusqlite directly)
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
